# 1.3.0 起公开仓库只检查、不打包：官方包要加官方模块（不公开），在别处打好再上传到 Release。
# 在这里打出来的包没有官方模块，发出去会让用户没有查分和自动更新，所以不能恢复成在这里发布。
name: 发版检查

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 连标签一起取：发版检查要和上一个正式版的外服名字表比
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.16"  # 和 1.0.0 一样；Python 一变 python313.dll 就变，老用户没法增量更新
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements-build.txt

      - name: 核对版本号
        run: |
          $version = (python -c "import lolhex; print(lolhex.__version__)").Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} 和 __version__ $version 不一致" }

      - name: 检查内置资料
        run: python scripts/check_release_data.py

      # 内置官方资料（static_bundled.json 等）不在这里现抓：1.1.2 起只发审核过的那份。
      # 现抓的总表日期是当天、单英雄日期是腾讯的，对不上时程序启动就报错

      - name: 测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
